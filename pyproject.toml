[project]
name = "gridaid"
version = "0.1.0"
description = "Reproducible emergency-resource resilience planning simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn>=0.38,<1", "pydantic>=2.12,<3",
  "numpy>=2.2,<3", "pandas>=2.2,<4", "networkx>=3.4,<4",
  "ortools>=9.12,<10", "scikit-learn>=1.7,<2", "scipy>=1.15,<2", "joblib>=1.6,<2",
  "geopandas>=1.0,<2", "shapely>=2,<3", "pyproj>=3.7,<4",
  "osmium>=4,<5", "osmnx>=2,<3", "httpx>=0.28,<1", "pyarrow>=19,<24"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "pip-audit>=2.9,<3", "bandit>=1.8,<2", "detect-secrets>=1.5,<2", "pypdf>=6.12,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv312", "frontend/node_modules"]
